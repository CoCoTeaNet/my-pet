services:
  my-pet:
    build:
      context: .
      args:
        NPM_REGISTRY: https://registry.npmmirror.com
        GOPROXY: https://goproxy.cn,direct
        APK_MIRROR: https://mirrors.aliyun.com
    container_name: my-pet
    ports:
      - "8080:8080"
    volumes:
      - ./data:/app/data
    environment:
      - PORT=8080
      - JWT_SECRET=my-pet-secret-key-2026
      - DB_PATH=/app/data/my-pet.db
    restart: unless-stopped
